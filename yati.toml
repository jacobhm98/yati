# Files to copy from the main worktree into new worktrees.
# Useful for secrets and local config that shouldn't be in git.
copy_files = [".env", ".env.local"]

# Glob patterns to exclude from copy_files.
exclude = ["*.log"]

# Commands to run in the worktree directory after creating it.
# Hooks can be plain strings (run synchronously before the tmux session)
# or objects with `async = true` (run in a background tmux "setup" window).
post_create = [
  "echo setting up",
  { command = "npm install", async = true },
]

# Commands to run every time a worktree is activated (including after creation).
post_activate = ["docker compose up -d"]

# Commands to run before tearing down a worktree.
pre_teardown = ["docker compose down"]

# Tmux windows to create in the session.
# The first window replaces the default window; additional entries
# create new windows. If omitted, a single unnamed window is used.
[tmux]
windows = [
  { name = "editor", command = "nvim" },
  { name = "server", command = "npm run dev" },
  { name = "shell" },
]

# Per-worktree port isolation for docker-compose.
# Each worktree gets an auto-assigned index (0, 1, 2...);
# port env vars are set to base + index * offset.
# This keeps host ports unique across concurrent worktrees.
[ports]
offset = 100
DB_PORT = 5432
WEB_PORT = 3000

# Arbitrary environment variables injected into the tmux session.
# Supports {{project}} and {{branch}} template placeholders.
[environment]
MY_SERVICE_ID = "{{project}}-{{branch}}"

# Named profiles. The config above is the base (used when --profile is omitted);
# each profile layers on top of it, overriding only the fields it sets.
# Select one with: yati create <branch> --profile <name>
# A profile may override windows, post_create, post_activate, pre_teardown, and
# environment. List fields replace the base; environment merges (profile wins).
[profiles.backend]
windows = [
  { name = "editor", command = "nvim" },
  { name = "api", command = "go run ./cmd/api" },
]

[profiles.frontend]
# Inherits the base post_create/environment; overrides only the windows.
windows = [
  { name = "editor", command = "nvim" },
  { name = "dev", command = "npm run dev" },
]
